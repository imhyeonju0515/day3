<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지금 지구의 지진</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; font-family: sans-serif; background: #0b1020; color: #e8ecf5; }
    .bar { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; padding: .6rem .8rem; background: #131a30; border-bottom: 1px solid #25304f; }
    button { padding: .4rem .8rem; font-size: .95rem; border: 1px solid #3a4770; border-radius: 6px; background: #1b2545; color: #e8ecf5; cursor: pointer; }
    button.on { background: #ff8a3d; border-color: #ff8a3d; color: #fff; }
    #slider { flex: 1; min-width: 140px; }
    #clock { font-variant-numeric: tabular-nums; min-width: 8.5rem; text-align: right; font-size: .9rem; }
    #stats { padding: .35rem .8rem; font-size: .85rem; color: #aab4d4; background: #0f152a; }
    .stage { flex: 1; position: relative; min-height: 0; }
    #map, #globe { position: absolute; inset: 0; }
    #globe { display: none; }
    .legend { position: absolute; right: 10px; bottom: 24px; z-index: 500; background: rgba(11,16,32,.85); padding: .45rem .6rem; border-radius: 8px; font-size: .78rem; line-height: 1.5; }
    .legend i { display: inline-block; width: .7rem; height: .7rem; border-radius: 50%; margin-right: .35rem; vertical-align: middle; }
    .pulse { position: absolute; left: 0; top: 0; width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); border: 3px solid var(--c); border-radius: 50%; animation: ripple 1.4s ease-out forwards; pointer-events: none; }
    @keyframes ripple { from { transform: scale(.2); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }
  </style>
</head>
<body>
  <div class="bar">
    <button id="vMap" class="on">지도</button>
    <button id="vGlobe">3D 지구본</button>
    <button id="play">▶ 24시간 재생</button>
    <input id="slider" type="range" min="0" max="1000" value="1000" aria-label="시간">
    <span id="clock"></span>
    <button id="reload">새로고침</button>
  </div>
  <div id="stats">불러오는 중…</div>
  <div class="stage">
    <div id="map"></div>
    <div id="globe"></div>
    <div class="legend">
      <div><i style="background:#7bd88f"></i>M 2.5 미만</div>
      <div><i style="background:#ffd166"></i>M 2.5 ~ 4.5</div>
      <div><i style="background:#ff8c42"></i>M 4.5 ~ 6</div>
      <div><i style="background:#ef476f"></i>M 6 이상</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/globe.gl@2.27.2/dist/globe.gl.min.js"></script>
  <script>
    // USGS 지진 피드: 최근 24시간, 키 없음. 규모 -1 ~ 7 이상까지 수백 건.
    const FEED = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson';
    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const color = (m) => (m < 2.5 ? '#7bd88f' : m < 4.5 ? '#ffd166' : m < 6 ? '#ff8c42' : '#ef476f');
    const radius = (m) => 2 + Math.pow(1.7, Math.max(m, 0));   // 규모가 커질수록 빠르게 커짐
    const rgba = (hex, a) => 'rgba(' + [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)).join(',') + ',' + a + ')';
    const fmt = (ms) => new Date(ms).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

    let quakes = [], tMin = 0, tMax = 0, t = 0, timer = null, view = 'map', globe = null;

    // ---------- 지도 ----------
    const map = L.map('map', { worldCopyJump: true }).setView([20, 10], 2);
    // 주의: OSM 타일 서버는 파일로 직접 연 페이지(Referer 없음)를 403으로 막을 수 있어요. http(s) 주소로 열어야 합니다.
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors · 데이터 USGS', maxZoom: 18,
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);

    function popup(q) {
      const d = document.createElement('div');
      const b = document.createElement('b');
      b.textContent = 'M ' + q.mag.toFixed(1) + ' · ' + q.place;
      const a = document.createElement('a');
      a.href = q.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'USGS 상세';
      d.append(b, document.createElement('br'), fmt(q.time) + ' · 깊이 ' + Math.round(q.depth) + 'km', document.createElement('br'), a);
      return d;
    }

    function drawMap(vis, fresh) {
      layer.clearLayers();
      for (const q of vis) {
        L.circleMarker([q.lat, q.lon], { radius: radius(q.mag), color: q.color, weight: 1, fillColor: q.color, fillOpacity: 0.45 })
          .bindPopup(() => popup(q)).addTo(layer);
      }
      for (const q of fresh) {   // 방금 나타난 지진은 번져 나가는 원을 한 번 보여줌
        const s = radius(q.mag) * 5;
        const m = L.marker([q.lat, q.lon], {
          interactive: false,
          icon: L.divIcon({ className: '', iconSize: [0, 0], html: '<span class="pulse" style="--s:' + s + 'px;--c:' + q.color + '"></span>' }),
        }).addTo(map);
        setTimeout(() => m.remove(), 1500);
      }
    }

    // ---------- 3D 지구본 ----------
    function ensureGlobe() {
      if (globe) return;
      const img = 'https://unpkg.com/three-globe@2.30.0/example/img/';
      globe = Globe()($('globe'))
        .globeImageUrl(img + 'earth-blue-marble.jpg')
        .bumpImageUrl(img + 'earth-topology.png')
        .backgroundImageUrl(img + 'night-sky.png')
        .pointLat('lat').pointLng('lon')
        .pointAltitude((d) => Math.max(0.005, d.mag * 0.012))
        .pointRadius((d) => 0.12 + Math.max(d.mag, 0) * 0.07)
        .pointColor((d) => d.color)
        .pointLabel((d) => '<b>M ' + d.mag.toFixed(1) + '</b> ' + esc(d.place))
        .ringLat('lat').ringLng('lon')
        .ringMaxRadius((d) => 2 + Math.max(d.mag, 0) * 1.6)
        .ringPropagationSpeed(2).ringRepeatPeriod(1400)
        .ringColor((d) => (p) => rgba(d.color, 1 - p));
      globe.controls().autoRotate = true;
      globe.controls().autoRotateSpeed = 0.4;
      globe.pointOfView({ lat: 20, lng: 120, altitude: 2.3 });
      sizeGlobe();
    }
    const sizeGlobe = () => globe && globe.width($('globe').clientWidth).height($('globe').clientHeight);
    window.addEventListener('resize', sizeGlobe);

    function drawGlobe(vis) {
      ensureGlobe();
      globe.pointsData(vis);
      globe.ringsData(vis.filter((q) => q.mag >= 4.5 || t - q.time < 60 * 60e3));   // 큰 지진과 최근 1시간
    }

    // ---------- 공통 ----------
    function render(fresh = []) {
      const vis = quakes.filter((q) => q.time <= t);
      $('slider').value = tMax > tMin ? ((t - tMin) / (tMax - tMin)) * 1000 : 1000;
      $('clock').textContent = fmt(t);
      const top = vis.reduce((a, q) => (!a || q.mag > a.mag ? q : a), null);
      $('stats').textContent = vis.length + '건 표시 중' + (top ? ' · 최대 M ' + top.mag.toFixed(1) + ' (' + top.place + ')' : '');
      if (view === 'map') drawMap(vis, fresh); else drawGlobe(vis);
    }

    function setView(v) {
      view = v;
      $('map').style.display = v === 'map' ? 'block' : 'none';
      $('globe').style.display = v === 'globe' ? 'block' : 'none';
      $('vMap').classList.toggle('on', v === 'map');
      $('vGlobe').classList.toggle('on', v === 'globe');
      if (v === 'map') map.invalidateSize(); else sizeGlobe();
      render();
      if (v === 'globe') sizeGlobe();
    }

    function stop() { clearInterval(timer); timer = null; $('play').textContent = '▶ 24시간 재생'; }
    function play() {
      if (timer) return stop();
      if (t >= tMax) t = tMin;
      $('play').textContent = '❚❚ 일시정지';
      const step = Math.max((tMax - tMin) / 150, 1);   // 약 12초에 24시간
      timer = setInterval(() => {
        const prev = t;
        t = Math.min(tMax, t + step);
        render(quakes.filter((q) => q.time > prev && q.time <= t));
        if (t >= tMax) stop();
      }, 80);
    }

    async function load() {
      stop();
      $('stats').textContent = '불러오는 중…';
      try {
        const res = await fetch(FEED);
        const data = await res.json();
        quakes = data.features
          .filter((f) => f.properties.mag !== null)
          .map((f) => ({
            mag: f.properties.mag, place: f.properties.place || '위치 정보 없음', time: f.properties.time, url: f.properties.url,
            lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], depth: f.geometry.coordinates[2], color: color(f.properties.mag),
          }))
          .sort((a, b) => a.time - b.time);
        if (!quakes.length) { $('stats').textContent = '최근 24시간 지진 데이터가 없어요.'; return; }
        tMin = quakes[0].time; tMax = quakes[quakes.length - 1].time; t = tMax;
        render();
      } catch {
        $('stats').textContent = '불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 보세요.';
      }
    }

    $('vMap').onclick = () => setView('map');
    $('vGlobe').onclick = () => setView('globe');
    $('play').onclick = play;
    $('reload').onclick = load;
    $('slider').oninput = (e) => { stop(); t = tMin + (e.target.value / 1000) * (tMax - tMin); render(); };
    load();
  </script>
</body>
</html>
